<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 120" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="kash-stem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8F5D8"/>
      <stop offset="100%" stop-color="#6B8E4A"/>
    </linearGradient>
    <radialGradient id="kash-head" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="white"/>
      <stop offset="60%" stop-color="#FFF7ED"/>
      <stop offset="100%" stop-color="#E7D8C4"/>
    </radialGradient>
    <filter id="kash-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>

  <!-- Ground base subtle -->
  <ellipse cx="150" cy="112" rx="128" ry="7" fill="#FFD60A" opacity="0.07"/>

  <!-- Cluster of kash phool (white saccharum grass) - iconic autumn Puja flower -->
  <!-- stems + feathery heads -->
  <g stroke="url(#kash-stem)" stroke-linecap="round" fill="none">
    <!-- left cluster -->
    <path d="M 38 108 C 42 88, 36 62, 32 38" stroke-width="1.2"/>
    <path d="M 58 108 C 60 84, 54 58, 48 32" stroke-width="1.3"/>
    <path d="M 72 108 C 74 86, 72 54, 68 28" stroke-width="1.4"/>
    <path d="M 88 108 C 86 82, 80 52, 82 26" stroke-width="1.25"/>
    <!-- center cluster (taller) -->
    <path d="M 112 108 C 112 82, 108 48, 110 20" stroke-width="1.5"/>
    <path d="M 128 108 C 130 78, 128 46, 132 18" stroke-width="1.4"/>
    <path d="M 150 108 C 152 76, 148 42, 150 14" stroke-width="1.6"/>
    <path d="M 172 108 C 170 78, 174 44, 170 18" stroke-width="1.4"/>
    <path d="M 188 108 C 186 82, 192 48, 190 20" stroke-width="1.5"/>
    <!-- right cluster -->
    <path d="M 212 108 C 214 82, 218 50, 218 26" stroke-width="1.25"/>
    <path d="M 228 108 C 230 86, 232 56, 232 28" stroke-width="1.4"/>
    <path d="M 242 108 C 242 84, 248 60, 250 32" stroke-width="1.3"/>
    <path d="M 262 108 C 258 88, 264 62, 268 38" stroke-width="1.2"/>
  </g>

  <!-- Feathery heads - soft white plumes -->
  <!-- each head is cluster of lines with glow -->
  <g opacity="0.95">
    <!-- 32,38 -->
    <g transform="translate(32,38)">
      <ellipse cx="0" cy="0" rx="14" ry="18" fill="white" opacity="0.12" filter="url(#kash-soft)"/>
      <path d="M0 -14 C 4 -10, 6 -4, 2 0 C 6 4, 4 10, 0 14 C -4 10, -6 4, -2 0 C -6 -4, -4 -10, 0 -14 Z" fill="url(#kash-head)" stroke="#E7D8C4" stroke-width="0.35"/>
      <g stroke="white" stroke-width="0.35" opacity="0.65" stroke-linecap="round">
        <path d="M0 -14 L 2 -6"/><path d="M0 -14 L -2 -6"/>
        <path d="M10 -4 L 2 0"/><path d="M10 -4 L 4 -2"/>
        <path d="M -10 -4 L -2 0"/><path d="M -10 -4 L -4 -2"/>
        <path d="M0 14 L 2 6"/><path d="M0 14 L -2 6"/>
      </g>
    </g>
    <!-- 48,32 -->
    <g transform="translate(48,32)">
      <ellipse cx="0" cy="0" rx="15" ry="20" fill="white" opacity="0.12" filter="url(#kash-soft)"/>
      <path d="M0 -16 C 5 -11, 7 -4, 2 0 C 7 4, 5 11, 0 16 C -5 11, -7 4, -2 0 C -7 -4, -5 -11, 0 -16 Z" fill="url(#kash-head)" stroke="#E7D8C4" stroke-width="0.35"/>
    </g>
    <!-- 68,28 -->
    <g transform="translate(68,28)">
      <ellipse cx="0" cy="0" rx="16" ry="22" fill="white" opacity="0.14" filter="url(#kash-soft)"/>
      <path d="M0 -18 C 6 -12, 8 -5, 2 0 C 8 5, 6 12, 0 18 C -6 12, -8 5, -2 0 C -8 -5, -6 -12, 0 -18 Z" fill="url(#kash-head)" stroke="#E7D8C4" stroke-width="0.35"/>
    </g>
    <!-- 82,26 -->
    <g transform="translate(82,26)">
      <ellipse cx="0" cy="0" rx="13" ry="17" fill="white" opacity="0.11" filter="url(#kash-soft)"/>
      <path d="M0 -14 C 4 -10, 6 -4, 2 0 C 6 4, 4 10, 0 14 C -4 10, -6 4, -2 0 C -6 -4, -4 -10, 0 -14 Z" fill="url(#kash-head)" stroke="#E7D8C4" stroke-width="0.35"/>
    </g>
    <!-- center tall -->
    <g transform="translate(110,20)">
      <ellipse cx="0" cy="0" rx="16" ry="22" fill="white" opacity="0.14" filter="url(#kash-soft)"/>
      <path d="M0 -18 C 6 -12, 8 -5, 2 0 C 8 5, 6 12, 0 18 C -6 12, -8 5, -2 0 C -8 -5, -6 -12, 0 -18 Z" fill="url(#kash-head)" stroke="#E7D8C4" stroke-width="0.35"/>
    </g>
    <g transform="translate(132,18)">
      <ellipse cx="0" cy="0" rx="17" ry="24" fill="white" opacity="0.15" filter="url(#kash-soft)"/>
      <path d="M0 -20 C 7 -13, 9 -6, 2 0 C 9 6, 7 13, 0 20 C -7 13, -9 6, -2 0 C -9 -6, -7 -13, 0 -20 Z" fill="url(#kash-head)" stroke="#E7D8C4" stroke-width="0.35"/>
      <circle cx="0" cy="0" r="2.2" fill="white" opacity="0.95"/>
    </g>
    <g transform="translate(150,14)">
      <ellipse cx="0" cy="0" rx="18" ry="26" fill="white" opacity="0.16" filter="url(#kash-soft)"/>
      <path d="M0 -22 C 7 -15, 10 -6, 2 0 C 10 6, 7 15, 0 22 C -7 15, -10 6, -2 0 C -10 -6, -7 -15, 0 -22 Z" fill="url(#kash-head)" stroke="#E7D8C4" stroke-width="0.35"/>
      <circle cx="0" cy="0" r="2.5" fill="white"/>
      <circle cx="0" cy="0" r="1" fill="#FFD60A" opacity="0.8"/>
    </g>
    <g transform="translate(170,18)">
      <ellipse cx="0" cy="0" rx="17" ry="24" fill="white" opacity="0.15" filter="url(#kash-soft)"/>
      <path d="M0 -20 C 7 -13, 9 -6, 2 0 C 9 6, 7 13, 0 20 C -7 13, -9 6, -2 0 C -9 -6, -7 -13, 0 -20 Z" fill="url(#kash-head)" stroke="#E7D8C4" stroke-width="0.35"/>
    </g>
    <g transform="translate(190,20)">
      <ellipse cx="0" cy="0" rx="16" ry="22" fill="white" opacity="0.14" filter="url(#kash-soft)"/>
      <path d="M0 -18 C 6 -12, 8 -5, 2 0 C 8 5, 6 12, 0 18 C -6 12, -8 5, -2 0 C -8 -5, -6 -12, 0 -18 Z" fill="url(#kash-head)" stroke="#E7D8C4" stroke-width="0.35"/>
    </g>
    <g transform="translate(218,26)">
      <ellipse cx="0" cy="0" rx="13" ry="17" fill="white" opacity="0.11" filter="url(#kash-soft)"/>
      <path d="M0 -14 C 4 -10, 6 -4, 2 0 C 6 4, 4 10, 0 14 C -4 10, -6 4, -2 0 C -6 -4, -4 -10, 0 -14 Z" fill="url(#kash-head)" stroke="#E7D8C4" stroke-width="0.35"/>
    </g>
    <g transform="translate(232,28)">
      <ellipse cx="0" cy="0" rx="16" ry="22" fill="white" opacity="0.14" filter="url(#kash-soft)"/>
      <path d="M0 -18 C 6 -12, 8 -5, 2 0 C 8 5, 6 12, 0 18 C -6 12, -8 5, -2 0 C -8 -5, -6 -12, 0 -18 Z" fill="url(#kash-head)" stroke="#E7D8C4" stroke-width="0.35"/>
    </g>
    <g transform="translate(250,32)">
      <ellipse cx="0" cy="0" rx="15" ry="20" fill="white" opacity="0.12" filter="url(#kash-soft)"/>
      <path d="M0 -16 C 5 -11, 7 -4, 2 0 C 7 4, 5 11, 0 16 C -5 11, -7 4, -2 0 C -7 -4, -5 -11, 0 -16 Z" fill="url(#kash-head)" stroke="#E7D8C4" stroke-width="0.35"/>
    </g>
    <g transform="translate(268,38)">
      <ellipse cx="0" cy="0" rx="14" ry="18" fill="white" opacity="0.12" filter="url(#kash-soft)"/>
      <path d="M0 -14 C 4 -10, 6 -4, 2 0 C 6 4, 4 10, 0 14 C -4 10, -6 4, -2 0 C -6 -4, -4 -10, 0 -14 Z" fill="url(#kash-head)" stroke="#E7D8C4" stroke-width="0.35"/>
    </g>
  </g>

  <!-- Floating seeds -->
  <g fill="white" opacity="0.35" font-size="5">
    <circle cx="100" cy="14" r="0.7"/>
    <circle cx="165" cy="10" r="0.6"/>
    <circle cx="200" cy="16" r="0.5"/>
    <circle cx="78" cy="18" r="0.5"/>
  </g>

  <!-- Bengali text subtle -->
  <text x="150" y="118" text-anchor="middle" font-size="6" fill="#FFD60A" opacity="0.35" letter-spacing="0.2em" font-family="serif">শরতের কাশফুল</text>
</svg>
