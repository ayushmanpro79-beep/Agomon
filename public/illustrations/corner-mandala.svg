<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="cm-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7CC"/>
      <stop offset="50%" stop-color="#FFD60A"/>
      <stop offset="100%" stop-color="#A16207"/>
    </linearGradient>
  </defs>
  <!-- Corner mandala - for top-left / top-right decoration, use with transform scaleX(-1) for mirroring -->
  <!-- Outer arch -->
  <path d="M 4 112 L 4 18 C 4 10, 10 4, 18 4 L 112 4" stroke="#FFD60A" stroke-width="1.1" fill="none" stroke-linecap="round" opacity="0.95"/>
  <path d="M 8 104 L 8 22 C 8 14, 14 8, 22 8 L 104 8" stroke="#FFD60A" stroke-width="0.5" fill="none" opacity="0.42"/>
  <!-- Lotus corner motif -->
  <g transform="translate(18,18)">
    <circle cx="28" cy="28" r="2.8" fill="url(#cm-gold)"/>
    <!-- 8 petals centered at 28,28 -->
    <g fill="none" stroke="#FFD60A" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
      <path d="M28 8 C 32 13, 32 20, 28 28 C 24 20, 24 13, 28 8 Z"/>
      <path d="M28 48 C 32 43, 32 36, 28 28 C 24 36, 24 43, 28 48 Z"/>
      <path d="M8 28 C 13 24, 20 24, 28 28 C 20 32, 13 32, 8 28 Z"/>
      <path d="M48 28 C 43 24, 36 24, 28 28 C 36 32, 43 32, 48 28 Z"/>
      <path d="M14 14 C 18 13, 23 17, 28 28 C 17 23, 13 18, 14 14 Z"/>
      <path d="M42 14 C 38 13, 33 17, 28 28 C 39 23, 43 18, 42 14 Z"/>
      <path d="M14 42 C 13 38, 17 33, 28 28 C 23 39, 18 43, 14 42 Z"/>
      <path d="M42 42 C 43 38, 39 33, 28 28 C 33 39, 38 43, 42 42 Z"/>
    </g>
    <circle cx="28" cy="28" r="10" fill="none" stroke="#FFD60A" stroke-width="0.4" opacity="0.5"/>
    <circle cx="28" cy="28" r="18" fill="none" stroke="#FFD60A" stroke-width="0.3" opacity="0.22"/>
  </g>
  <!-- Paisley vines outward -->
  <path d="M 42 8 C 52 4, 62 8, 68 16" stroke="#FFD60A" stroke-width="0.9" fill="none" stroke-linecap="round" opacity="0.8"/>
  <path d="M 8 42 C 4 52, 8 62, 16 68" stroke="#FFD60A" stroke-width="0.9" fill="none" stroke-linecap="round" opacity="0.8"/>
  <!-- small paisley heads -->
  <path d="M 68 16 C 72 14, 76 16, 74 20 C 72 22, 68 20, 68 16" fill="none" stroke="#FFD60A" stroke-width="0.85" stroke-linecap="round"/>
  <path d="M 16 68 C 14 72, 16 76, 20 74 C 22 72, 20 68, 16 68" fill="none" stroke="#FFD60A" stroke-width="0.85" stroke-linecap="round"/>
  <!-- dots -->
  <circle cx="62" cy="8" r="1.2" fill="#FFF7CC" opacity="0.9"/>
  <circle cx="8" cy="62" r="1.2" fill="#FFF7CC" opacity="0.9"/>
  <circle cx="50" cy="10" r="0.7" fill="#FFD60A" opacity="0.6"/>
  <circle cx="10" cy="50" r="0.7" fill="#FFD60A" opacity="0.6"/>
  <!-- inner corner dots border -->
  <g fill="#FFD60A" opacity="0.42">
    <circle cx="14" cy="14" r="0.8"/>
    <circle cx="14" cy="22" r="0.6"/><circle cx="22" cy="14" r="0.6"/>
    <circle cx="14" cy="30" r="0.5"/><circle cx="30" cy="14" r="0.5"/>
  </g>
</svg>
