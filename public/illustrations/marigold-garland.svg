<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" fill="none" aria-hidden="true">
  <defs>
    <radialGradient id="mg-center" cx="50%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#FFE566"/>
      <stop offset="55%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </radialGradient>
    <radialGradient id="mg-leaf" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#86EFAC"/>
      <stop offset="60%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#14532D"/>
    </radialGradient>
    <linearGradient id="mg-string" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD60A" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#A16207" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="mg-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- hanging string with sag -->
  <path d="M0 18 Q 300 42, 600 26 T 1200 18" stroke="url(#mg-string)" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.95"/>
  <!-- second thread subtle -->
  <path d="M0 20 Q 300 44, 600 28 T 1200 20" stroke="#FFD60A" stroke-width="0.5" fill="none" opacity="0.25"/>

  <!-- Generator: marigold clusters + mango leaves alternating -->
  <!-- Helper: each flower group at intervals -->

  <!-- Flower at 45 -->
  <g transform="translate(45,46)">
    <path d="M0 0 L -4 28 L 4 28 Z" fill="#FFD60A" opacity="0.6"/> <!-- thread -->
    <!-- mango leaf left -->
    <path d="M -14 8 C -22 -2, -30 -8, -38 2 C -30 10, -22 12, -14 8 Z" fill="url(#mg-leaf)" stroke="#15803D" stroke-width="0.5"/>
    <path d="M -14 8 C -22 2, -30 4, -38 2" stroke="#14532D" stroke-width="0.4" fill="none"/>
    <!-- marigold flower -->
    <g filter="url(#mg-shadow)">
      <ellipse cx="0" cy="22" rx="18" ry="7" fill="#9A3412" opacity="0.9"/>
      <circle cx="0" cy="18" r="15" fill="#F97316"/>
      <circle cx="0" cy="18" r="11" fill="url(#mg-center)"/>
      <circle cx="0" cy="18" r="5.5" fill="#9A3412"/>
      <!-- petals ring -->
      <g fill="#F97316" stroke="#9A3412" stroke-width="0.4">
        <ellipse cx="0" cy="7.5" rx="5" ry="7"/>
        <ellipse cx="7.5" cy="10" rx="5" ry="7" transform="rotate(45 7.5 10)"/>
        <ellipse cx="10.5" cy="18" rx="5" ry="7" transform="rotate(90 10.5 18)"/>
        <ellipse cx="7.5" cy="26" rx="5" ry="7" transform="rotate(135 7.5 26)"/>
        <ellipse cx="0" cy="28.5" rx="5" ry="7"/>
        <ellipse cx="-7.5" cy="26" rx="5" ry="7" transform="rotate(45 -7.5 26)"/>
        <ellipse cx="-10.5" cy="18" rx="5" ry="7" transform="rotate(90 -10.5 18)"/>
        <ellipse cx="-7.5" cy="10" rx="5" ry="7" transform="rotate(135 -7.5 10)"/>
      </g>
      <circle cx="0" cy="18" r="7.5" fill="#FFFBEB" opacity="0.18"/>
    </g>
    <!-- mango leaf right -->
    <path d="M 14 8 C 22 -2, 30 -8, 38 2 C 30 10, 22 12, 14 8 Z" fill="url(#mg-leaf)" stroke="#15803D" stroke-width="0.5"/>
    <path d="M 14 8 C 22 2, 30 4, 38 2" stroke="#14532D" stroke-width="0.4" fill="none"/>
  </g>

  <!-- Flower at 165 -->
  <g transform="translate(165,58)">
    <path d="M0 0 L -4 32 L 4 32 Z" fill="#FFD60A" opacity="0.6"/>
    <path d="M -13 10 C -21 0, -29 -6, -37 4 C -29 12, -21 14, -13 10 Z" fill="url(#mg-leaf)" stroke="#15803D" stroke-width="0.5"/>
    <path d="M 13 10 C 21 0, 29 -6, 37 4 C 29 12, 21 14, 13 10 Z" fill="url(#mg-leaf)" stroke="#15803D" stroke-width="0.5"/>
    <g filter="url(#mg-shadow)">
      <circle cx="0" cy="22" r="13" fill="#F97316"/>
      <circle cx="0" cy="22" r="9.5" fill="url(#mg-center)"/>
      <circle cx="0" cy="22" r="4.8" fill="#9A3412"/>
      <g fill="#F97316" stroke="#9A3412" stroke-width="0.35">
        <ellipse cx="0" cy="12" rx="4.2" ry="6"/>
        <ellipse cx="7" cy="15" rx="4.2" ry="6" transform="rotate(45 7 15)"/>
        <ellipse cx="10" cy="22" rx="4.2" ry="6" transform="rotate(90 10 22)"/>
        <ellipse cx="7" cy="29" rx="4.2" ry="6" transform="rotate(135 7 29)"/>
        <ellipse cx="0" cy="32" rx="4.2" ry="6"/>
        <ellipse cx="-7" cy="29" rx="4.2" ry="6" transform="rotate(45 -7 29)"/>
        <ellipse cx="-10" cy="22" rx="4.2" ry="6" transform="rotate(90 -10 22)"/>
        <ellipse cx="-7" cy="15" rx="4.2" ry="6" transform="rotate(135 -7 15)"/>
      </g>
    </g>
  </g>

  <!-- Flower at 285 -->
  <g transform="translate(285,48)">
    <path d="M0 0 L -4 28 L 4 28 Z" fill="#FFD60A" opacity="0.6"/>
    <path d="M -14 8 C -24 -2, -32 -8, -40 2 C -32 10, -24 12, -14 8 Z" fill="url(#mg-leaf)" stroke="#15803D" stroke-width="0.5"/>
    <path d="M 14 8 C 24 -2, 32 -8, 40 2 C 32 10, 24 12, 14 8 Z" fill="url(#mg-leaf)" stroke="#15803D" stroke-width="0.5"/>
    <g filter="url(#mg-shadow)">
      <ellipse cx="0" cy="22" rx="19" ry="7.5" fill="#9A3412" opacity="0.9"/>
      <circle cx="0" cy="20" r="16" fill="#F97316"/>
      <circle cx="0" cy="20" r="12" fill="url(#mg-center)"/>
      <circle cx="0" cy="20" r="6" fill="#7C2D12"/>
      <g fill="#EA580C" stroke="#7C2D12" stroke-width="0.4">
        <ellipse cx="0" cy="8" rx="5.2" ry="7.5"/>
        <ellipse cx="8.5" cy="10.5" rx="5.2" ry="7.5" transform="rotate(45 8.5 10.5)"/>
        <ellipse cx="12" cy="20" rx="5.2" ry="7.5" transform="rotate(90 12 20)"/>
        <ellipse cx="8.5" cy="29.5" rx="5.2" ry="7.5" transform="rotate(135 8.5 29.5)"/>
        <ellipse cx="0" cy="32" rx="5.2" ry="7.5"/>
        <ellipse cx="-8.5" cy="29.5" rx="5.2" ry="7.5" transform="rotate(45 -8.5 29.5)"/>
        <ellipse cx="-12" cy="20" rx="5.2" ry="7.5" transform="rotate(90 -12 20)"/>
        <ellipse cx="-8.5" cy="10.5" rx="5.2" ry="7.5" transform="rotate(135 -8.5 10.5)"/>
      </g>
    </g>
  </g>

  <!-- Flower at 405 -->
  <g transform="translate(405,60)">
    <path d="M0 0 L -4 32 L 4 32 Z" fill="#FFD60A" opacity="0.6"/>
    <path d="M -13 10 C -21 0, -29 -6, -37 4 C -29 12, -21 14, -13 10 Z" fill="url(#mg-leaf)" />
    <path d="M 13 10 C 21 0, 29 -6, 37 4 C 29 12, 21 14, 13 10 Z" fill="url(#mg-leaf)"/>
    <g filter="url(#mg-shadow)">
