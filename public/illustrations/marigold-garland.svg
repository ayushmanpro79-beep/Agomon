    <g filter="url(#mg-shadow)">
      <ellipse cx="0" cy="30" rx="24" ry="9" fill="#7C2D12" opacity="0.85"/>
      <circle cx="0" cy="26" r="22" fill="#F97316"/>
      <circle cx="0" cy="26" r="17" fill="url(#mg-center)"/>
      <circle cx="0" cy="26" r="8" fill="#7C2D12"/>
      <circle cx="0" cy="26" r="4.5" fill="#450A0A"/>
      <g fill="#F97316" stroke="#7C2D12" stroke-width="0.45">
        <ellipse cx="0" cy="10" rx="6" ry="9"/>
        <ellipse cx="11.3" cy="14.7" rx="6" ry="9" transform="rotate(45 11.3 14.7)"/>
        <ellipse cx="16" cy="26" rx="6" ry="9" transform="rotate(90 16 26)"/>
        <ellipse cx="11.3" cy="37.3" rx="6" ry="9" transform="rotate(135 11.3 37.3)"/>
        <ellipse cx="0" cy="42" rx="6" ry="9"/>
        <ellipse cx="-11.3" cy="37.3" rx="6" ry="9" transform="rotate(45 -11.3 37.3)"/>
        <ellipse cx="-16" cy="26" rx="6" ry="9" transform="rotate(90 -16 26)"/>
        <ellipse cx="-11.3" cy="14.7" rx="6" ry="9" transform="rotate(135 -11.3 14.7)"/>
      </g>
      <!-- highlight -->
      <circle cx="-5" cy="20" r="5" fill="white" opacity="0.18"/>
    </g>
    <!-- small bell tassel -->
    <g transform="translate(0,52)">
      <path d="M -6 0 Q 0 6, 6 0 L 4 12 Q 0 16, -4 12 Z" fill="#FFD60A" stroke="#A16207" stroke-width="0.5"/>
      <circle cx="0" cy="14" r="2" fill="#FEF08A"/>
    </g>
  </g>

