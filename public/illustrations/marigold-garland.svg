  <!-- Flower at 1155 -->
  <g transform="translate(1155,46)">
    <path d="M0 0 L -4 28 L 4 28 Z" fill="#FFD60A" opacity="0.6"/>
    <path d="M -14 8 C -22 -2, -30 -8, -38 2 C -30 10, -22 12, -14 8 Z" fill="url(#mg-leaf)"/>
