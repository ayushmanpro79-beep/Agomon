        <ellipse cx="8.5" cy="10.5" rx="5.2" ry="7.5" transform="rotate(45 8.5 10.5)"/>
        <ellipse cx="12" cy="20" rx="5.2" ry="7.5" transform="rotate(90 12 20)"/>
        <ellipse cx="8.5" cy="29.5" rx="5.2" ry="7.5" transform="rotate(135 8.5 29.5)"/>
        <ellipse cx="0" cy="32" rx="5.2" ry="7.5"/>
        <ellipse cx="-8.5" cy="29.5" rx="5.2" ry="7.5" transform="rotate(45 -8.5 29.5)"/>
        <ellipse cx="-12" cy="20" rx="5.2" ry="7.5" transform="rotate(90 -12 20)"/>
        <ellipse cx="-8.5" cy="10.5" rx="5.2" ry="7.5" transform="rotate(135 -8.5 10.5)"/>
      </g>
    </g>
  </g>

  <!-- Flower at 1035 -->
  <g transform="translate(1035,58)">
    <path d="M0 0 L -4 32 L 4 32 Z" fill="#FFD60A" opacity="0.6"/>
    <path d="M -13 10 C -21 0, -29 -6, -37 4 C -29 12, -21 14, -13 10 Z" fill="url(#mg-leaf)"/>
    <path d="M 13 10 C 21 0, 29 -6, 37 4 C 29 12, 21 14, 13 10 Z" fill="url(#mg-leaf)"/>
    <g filter="url(#mg-shadow)">
      <circle cx="0" cy="22" r="13" fill="#F97316"/>
      <circle cx="0" cy="22" r="9.5" fill="url(#mg-center)"/>
      <circle cx="0" cy="22" r="4.8" fill="#9A3412"/>
      <g fill="#F97316" stroke="#9A3412" stroke-width="0.35">
        <ellipse cx="0" cy="12" rx="4.2" ry="6"/>
        <ellipse cx="7" cy="15" rx="4.2" ry="6" transform="rotate(45 7 15)"/>
        <ellipse cx="10" cy="22" rx="4.2" ry="6" transform="rotate(90 10 22)"/>
        <ellipse cx="7" cy="29" rx="4.2" ry="6" transform="rotate(135 7 29)"/>
        <ellipse cx="0" cy="32" rx="4.2" ry="6"/>
        <ellipse cx="-7" cy="29" rx="4.2" ry="6" transform="rotate(45 -7 29)"/>
        <ellipse cx="-10" cy="22" rx="4.2" ry="6" transform="rotate(90 -10 22)"/>
        <ellipse cx="-7" cy="15" rx="4.2" ry="6" transform="rotate(135 -7 15)"/>
