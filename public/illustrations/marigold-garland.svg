        <ellipse cx="7.5" cy="13.5" rx="5" ry="7" transform="rotate(45 7.5 13.5)"/>
        <ellipse cx="10.5" cy="22" rx="5" ry="7" transform="rotate(90 10.5 22)"/>
        <ellipse cx="7.5" cy="30.5" rx="5" ry="7" transform="rotate(135 7.5 30.5)"/>
