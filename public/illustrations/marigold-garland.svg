      <circle cx="0" cy="20" r="16" fill="#F97316"/>
      <circle cx="0" cy="20" r="12" fill="url(#mg-center)"/>
      <circle cx="0" cy="20" r="6" fill="#7C2D12"/>
      <g fill="#EA580C" stroke="#7C2D12" stroke-width="0.4">
