<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="sh-ivory" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFEF8"/>
      <stop offset="18%" stop-color="#FFF7E6"/>
      <stop offset="50%" stop-color="#FFE9B8"/>
      <stop offset="82%" stop-color="#E8C9A0"/>
      <stop offset="100%" stop-color="#C9A88A"/>
    </linearGradient>
    <linearGradient id="sh-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7CC"/>
      <stop offset="50%" stop-color="#FFD60A"/>
      <stop offset="100%" stop-color="#A16207"/>
    </linearGradient>
    <radialGradient id="sh-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.28"/>
    </radialGradient>
    <linearGradient id="sh-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD60A"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
  </defs>

  <!-- Conch shell body - classic left-spiral -->
  <!-- Main whorl -->
  <path d="M60 10 C 72 10, 84 18, 88 32 C 92 46, 88 60, 78 68 C 86 72, 90 84, 86 96 C 82 108, 70 118, 56 120 C 42 122, 28 116, 22 104 C 16 92, 20 78, 32 70 C 22 64, 16 52, 18 38 C 20 24, 32 12, 46 10 L 60 10 Z"
        fill="url(#sh-ivory)" stroke="#C9A88A" stroke-width="0.9"/>

  <!-- Spiral grooves - conch natural ridges -->
  <path d="M60 10 C 68 16, 74 24, 76 34" stroke="#D6AD8A" stroke-width="0.6" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M78 68 C 84 74, 85 86, 80 95" stroke="#D6AD8A" stroke-width="0.6" fill="none" opacity="0.7"/>
  <path d="M32 70 C 24 76, 20 86, 24 98" stroke="#D6AD8A" stroke-width="0.5" fill="none" opacity="0.6"/>
  <path d="M22 42 C 26 48, 32 54, 42 56" stroke="#D6AD8A" stroke-width="0.5" fill="none" opacity="0.55"/>

  <!-- Inner aperture lip highlight -->
  <ellipse cx="56" cy="106" rx="18" ry="10" fill="#FFF7E6" stroke="url(#sh-rim)" stroke-width="1.1"/>
  <ellipse cx="56" cy="106" rx="13" ry="6.5" fill="#1A0F0A" opacity="0.85"/>
  <ellipse cx="56" cy="107" rx="10" ry="4.5" fill="#2A1A10" opacity="0.9"/>
  <!-- inner throat shading -->
  <ellipse cx="54" cy="106" rx="6" ry="3" fill="black" opacity="0.35"/>

  <!-- Opening inner curve -->
  <path d="M38 106 C 44 96, 68 96, 74 106" stroke="#FFD60A" stroke-width="0.6" fill="none" opacity="0.7" stroke-linecap="round"/>

  <!-- Tip / apex -->
  <path d="M60 10 L 59 6 L 62 7 Z" fill="url(#sh-gold)" stroke="#92400E" stroke-width="0.4"/>
  <circle cx="60" cy="8.5" r="2" fill="url(#sh-gold)" stroke="#92400E" stroke-width="0.4"/>

  <!-- Sacred thread / gold bands around body -->
  <path d="M26 58 C 36 60, 52 62, 76 68" stroke="url(#sh-gold)" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.95"/>
  <path d="M28 78 C 38 80, 54 82, 84 88" stroke="url(#sh-gold)" stroke-width="1.3" fill="none" stroke-linecap="round" opacity="0.9"/>
  <path d="M26 58 C 36 60, 52 62, 76 68" stroke="white" stroke-width="0.35" opacity="0.4" fill="none"/>
  <path d="M28 78 C 38 80, 54 82, 84 88" stroke="white" stroke-width="0.3" opacity="0.4" fill="none"/>

  <!-- Decorative alpana on body: small lotus -->
  <g transform="translate(48,58)" opacity="0.85">
    <g fill="none" stroke="#C2410C" stroke-width="0.45" stroke-linecap="round">
      <path d="M0 -6.5 C 2 -4, 2 -1.5, 0 0 C -2 -1.5, -2 -4, 0 -6.5 Z"/>
      <path d="M0 6.5 C 2 4, 2 1.5, 0 0 C -2 1.5, -2 4, 0 6.5 Z"/>
      <path d="M-6.5 0 C -4 2, -1.5 2, 0 0 C -1.5 -2, -4 -2, -6.5 0 Z"/>
      <path d="M6.5 0 C 4 2, 1.5 2, 0 0 C 1.5 -2, 4 -2, 6.5 0 Z"/>
    </g>
    <circle cx="0" cy="0" r="1.4" fill="#FFD60A"/>
  </g>

  <!-- Vermillion tilak mark near tip -->
  <circle cx="66" cy="36" r="2.2" fill="#DC2626" stroke="#FFD60A" stroke-width="0.35" opacity="0.95"/>
  <circle cx="66" cy="36" r="0.9" fill="#FFD60A"/>

  <!-- Gold base / stand -->
  <ellipse cx="56" cy="124" rx="20" ry="4.2" fill="#451A03" opacity="0.18"/>
  <path d="M36 118 Q 56 128, 76 118 L 74 122 Q 56 132, 38 122 Z" fill="url(#sh-gold)" stroke="#92400E" stroke-width="0.5"/>
</svg>
